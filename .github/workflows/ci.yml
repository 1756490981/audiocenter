name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the real floor: the code uses PEP 604 unions and PEP 585
        # builtin generics in annotations that are evaluated at runtime.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every source file
        run: python -m compileall -q audio.py build.py iconutil.py main.py themecolors.py tabs tools

      # Catches requirements.txt drifting out of sync with the code, which is
      # how this repository shipped a version that could not even be imported.
      - name: Verify every module imports
        run: python tools/check_imports.py
